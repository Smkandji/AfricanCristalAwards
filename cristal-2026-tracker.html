/* ---------- render ---------- */
function fmtEuro(n){ return n.toLocaleString("fr-FR") + " €"; }

function daysUntil(dateStr){
  const target = new Date(dateStr);
  const now = new Date();
  return Math.max(0, Math.ceil((target - now) / 86400000));
}

function tagClass(tag){
  if(tag === "fort") return "tag-fort";
  if(tag === "à vérifier") return "tag-a-verifier";
  return "tag-optionnel";
}

function renderRow(e, state){
  const checked = !!state[e.id];
  return `<div class="row" data-id="${e.id}">
    <input type="checkbox" id="cb-${e.id}" ${checked ? "checked" : ""} aria-label="Sélectionner ${e.group} — ${e.sub}">
    <div class="cat-block">
      <div class="cat">${e.group} <span class="muted">›</span> ${e.sub}</div>
      <div class="note">${e.note}</div>
    </div>
    <div class="chips">
      <span class="chip type">${e.type}</span>
      <span class="chip ${tagClass(e.tag)}">${e.tag}</span>
    </div>
    <div class="fee">${fmtEuro(e.fee)}</div>
  </div>`;
}

function renderProjects(state){
  const byProject = [];
  const seen = {};
  ENTRIES.forEach(e => {
    if(!seen[e.project]){ seen[e.project] = { name: e.project, items: [] }; byProject.push(seen[e.project]); }
    seen[e.project].items.push(e);
  });
  return byProject.map(p => {
    const selectedCount = p.items.filter(e => state[e.id]).length;
    return `<div class="card">
      <header>
        <h2>${p.name}</h2>
        <span class="count">${selectedCount}/${p.items.length} catégorie(s) retenue(s)</span>
      </header>
      <div class="rows">${p.items.map(e => renderRow(e, state)).join("")}</div>
    </div>`;
  }).join("");
}

function renderShell(state){
  const selectedEntries = ENTRIES.filter(e => state[e.id]);
  const totalFee = selectedEntries.reduce((s,e) => s + e.fee, 0);
  const days = daysUntil(FESTIVAL_DATE);
  const daysLeft = daysUntil(DEADLINE_DATE);
  const urgent = daysLeft <= 10;
  return `
  <div class="wrap">
    <span class="save-status" id="save-status">—</span>
    <header class="top">
      <span class="eyebrow">African Cristal Festival 2026 · ${FESTIVAL_LOCATION}</span>
      <h1>Dossier de candidature — Voice Africa</h1>
      <p class="sub">Suivi des 5 projets à soumettre, des catégories envisagées et du budget d'entrée. Coche/décoche les catégories retenues — les choix sont sauvegardés automatiquement.</p>
    </header>

    <div class="deadline-banner">🗓️ Clôture des dépôts : <span class="mono">25 septembre 2026</span> — soit <span class="mono">J-${daysLeft}</span></div>

    <div class="stats">
      <div class="tile"><span class="num mono">${selectedEntries.length}<span class="muted" style="font-size:15px"> / ${ENTRIES.length}</span></span><span class="label">Entrées retenues</span></div>
      <div class="tile"><span class="num mono">${fmtEuro(totalFee)}</span><span class="label">Budget estimé (tarif standard)</span></div>
      <div class="tile${urgent ? " urgent" : ""}"><span class="num mono">${daysLeft}</span><span class="label">Jours avant la clôture (25 sept.)</span></div>
      <div class="tile"><span class="num mono">${days}</span><span class="label">Jours avant le festival (15 oct. 2026)</span></div>
    </div>

    <div class="callout">
      <h3>À trancher avec Sidy cette semaine</h3>
      <ol>
        <li>Dates de diffusion/lancement des projets (doivent tomber entre le 1ᵉʳ octobre 2025 et le 25 septembre 2026 pour être éligibles).</li>
        <li>Valider ou écarter les catégories proposées ci-dessous, projet par projet.</li>
        <li>Préciser ce qu'est « Soda Use Case » — marque, plateforme, contexte — pour affiner le choix de catégorie.</li>
        <li>Réunir pour chaque entrée : accord écrit de la marque + coordonnées d'un contact chez l'annonceur (règle obligatoire du festival).</li>
        <li>Obtenir la validation budgétaire de la direction avant la clôture du 25 septembre.</li>
      </ol>
      <p>Tarif appliqué : la fenêtre early bird (jusqu'au 7 août 2026) est passée — tarif standard retenu partout : 250 € / entrée simple, 420 € / campagne.</p>
    </div>

    <section class="projects">${renderProjects(state)}</section>

    <div class="rules">
      <h2>Rappel des règles clés d'entrée</h2>
      <ul>${RULES.map(r => `<li>${r}</li>`).join("")}</ul>
    </div>

    <footer>
      <span>Dernière mise à jour du contenu : 18 septembre 2026 · Sources : africancristalfestival.com, africancristalfestival.awardsengine.com/rules</span>
      <span>Doute sur une éligibilité : contact@africancristalfestival.com</span>
    </footer>
  </div>`;
}

/* ---------- boot & interaction ---------- */
function buildDocument(state){
  const scriptSrc = document.getElementById("app-script").textContent
    .replace(/\/\*S\*\/[\s\S]*?\/\*E\*\//, "/*S*/" + JSON.stringify(state) + "/*E*/");
  return "<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>" + TITLE + "</title>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap\">\n<style>" + CSS + "</style>\n</head>\n<body>\n<div id=\"app\">" + renderShell(state) + "</div>\n<script id=\"app-script\">" + scriptSrc + "</" + "script>\n</body>\n</html>";
}

let artifactApi = null;
let saving = false;

function setSaveStatus(text){
  const el = document.getElementById("save-status");
  if(el) el.textContent = text;
}

async function persist(){
  if(!artifactApi){ setSaveStatus("Non sauvegardé (session en lecture seule)"); return; }
  if(saving) return;
  saving = true;
  setSaveStatus("Enregistrement…");
  try{
    await artifactApi.publish(buildDocument(STATE));
    setSaveStatus("Enregistré ✓");
  }catch(err){
    setSaveStatus("Non enregistré — réessaie");
  }finally{
    saving = false;
  }
}

function attachHandlers(){
  document.querySelectorAll("#app input[type=checkbox]").forEach(cb => {
    cb.addEventListener("change", () => {
      const id = cb.closest(".row").dataset.id;
      STATE[id] = cb.checked;
      document.getElementById("app").innerHTML = renderShell(STATE);
      attachHandlers();
      persist();
    });
  });
}

function init(){
  document.getElementById("app-style").textContent = CSS;
  document.getElementById("app").innerHTML = renderShell(STATE);
  attachHandlers();
  if(window.claude && window.claude.use){
    window.claude.use("artifact").then(api => {
      artifactApi = api;
      setSaveStatus(api ? "Prêt à sauvegarder" : "Non sauvegardé (capacité indisponible)");
    }).catch(() => setSaveStatus("Non sauvegardé (capacité indisponible)"));
  } else {
    setSaveStatus("Non sauvegardé (aperçu local)");
  }
}

if(window.claude && window.claude.hot){
  window.claude.hot.snapshot && window.claude.hot.snapshot(() => STATE);
  window.claude.hot.ready ? window.claude.hot.ready(init) : init();
}else{
  init();
}
</script>
